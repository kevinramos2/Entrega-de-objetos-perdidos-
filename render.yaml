# ---------------------------------------------------------------------------
# Render Blueprint - Despliegue de "Entrega de objetos perdidos"
# ---------------------------------------------------------------------------
# Cómo usarlo:
#   1) Render -> Dashboard -> "New +" -> "Blueprint" -> elige este repositorio.
#   2) Render detecta este archivo y crea el Web Service (ya no provisiona
#      una base de datos: el Postgres gratis de Render expira a los 30 días,
#      así que la base vive en Neon — ver DATABASE_URL más abajo).
#   3) Escribe el valor de DJANGO_SECRET_KEY, DATABASE_URL (la de Neon) y
#      GOOGLE_OAUTH_* cuando Render lo pida.
#   4) "Apply" y espera el despliegue.
# En el primer arranque se ejecutan las migraciones (startCommand).
# ---------------------------------------------------------------------------

services:
  - type: web
    name: objetos-perdidos
    runtime: python
    rootDir: objetos_reclamados
    plan: free

    # Dependencias + estáticos
    buildCommand: "pip install -r ../requirements.txt && python manage.py collectstatic --noinput"

    startCommand: "python manage.py migrate && python manage.py recomprimir_fotos && python manage.py promocionar_admins && python manage.py seed_objetos_prueba && gunicorn objetos_reclamados.wsgi:application --bind 0.0.0.0:$PORT"

    healthCheckPath: /

    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      # Obligatoria: Render te pedirá escribirla al crear el blueprint.
      # Genera una con:
      #   python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      - key: DJANGO_SECRET_KEY
        sync: false
      # Host permitido = la URL .onrender.com que Render le asigne al servicio
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: objetos-perdidos
          property: host
      # Único dominio dado de alta
      - key: DJANGO_EMAIL_DOMAINS
        value: unal.edu.co
      # Correo que se convierte en administrador automáticamente
      # (coloca aquí el correo institucional del administrador del sitio)
      - key: DJANGO_ADMIN_EMAILS
        value: tu.correo@unal.edu.co
      # OAuth de Google (opcional). Con valores vacíos el botón no se muestra.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Postgres de Neon (no expira, a diferencia del de Render). Pega aquí
      # la "Connection string" que te da Neon al crear el proyecto —
      # incluye "?sslmode=require", no lo quites.
      - key: DATABASE_URL
        sync: false
      # URL pública del frontend en Vercel. Se usa para CORS y para el
      # redirect final del login con Google hacia la SPA (ver
      # registro_objetos/api/auth_views.py::google_auth_bridge). Déjala sin
      # definir hasta tener la URL real de Vercel.
      - key: FRONTEND_URL
        sync: false