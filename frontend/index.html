<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Objetos Perdidos UNAL</title>
    <script>
      (function () {
        var html = document.documentElement
        var tema = null
        try { tema = localStorage.getItem('tema-aplicacion') } catch (e) {}
        if (tema !== 'claro' && tema !== 'oscuro' && window.matchMedia) {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        if (tema === 'oscuro') html.setAttribute('data-tema', 'oscuro')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
