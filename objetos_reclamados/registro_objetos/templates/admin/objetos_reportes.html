{% extends "admin/change_list.html" %}

{% block content %}
<style>
    .grafico-contenedor {
        max-width: 400px;
        margin: 20px auto;
    }
</style>

<h2>Objetos entregados por tipo</h2>
<div class="grafico-contenedor">
    <canvas id="graficoObjetos"></canvas>
</div>

<hr>

<h2>Porcentaje de personas que dieron correo</h2>
<div class="grafico-contenedor">
    <canvas id="graficoCorreo"></canvas>
</div>

<hr>

<h2>Entregas por fecha</h2>
<div class="grafico-contenedor">
    <canvas id="graficoFecha"></canvas>
</div>

<hr>

<!-- <table border="1" cellpadding="5" cellspacing="0">
    <tr>s
        <th>Tipo de Objeto</th>
        <th>Total Entregados</th>
    </tr>
    {% for fila in datos_por_tipo %}
    <tr>
        <td>{{ fila.tipo_objeto }}</td>

    </tr>
    {% endfor %}
</table> -->

<hr>
{{ block.super }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Gráfico por tipo de objeto
    new Chart(document.getElementById('graficoObjetos'), {
        type: 'bar',
        data: {
            labels: {{ chart_labels|safe }},
            datasets: [{
                label: 'Objetos entregados',
                data: {{ chart_values|safe }},
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    ticks: {
                        autoSkip: true,    // Salta etiquetas si hay muchas
                        maxRotation: 45,   // Rota etiquetas si es necesario
                        minRotation: 0
                    }
                },
                y: {
                    beginAtZero: true
                }
            }
        }
    });


    // Gráfico de pastel para porcentajes de correo
    new Chart(document.getElementById('graficoCorreo'), {
        type: 'pie',
        data: {
            labels: {{ correo_labels|safe }},
            datasets: [{
                data: {{ correo_values|safe }},
                backgroundColor: ['rgba(75, 192, 192, 0.6)', 'rgba(255, 99, 132, 0.6)'],
                borderColor: ['rgba(75, 192, 192, 1)', 'rgba(255, 99, 132, 1)'],
                borderWidth: 1
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // Gráfico por fecha
    new Chart(document.getElementById('graficoFecha'), {
        type: 'line',
        data: {
            labels: {{ fecha_labels|safe }},
            datasets: [{
                label: 'Entregas por día',
                data: {{ fecha_values|safe }},
                fill: false,
                borderColor: 'rgba(153, 102, 255, 1)',
                tension: 0.2,
                pointBackgroundColor: {{ fecha_values|safe }}.map((v, i) =>
                    i === {{ max_fecha_index }} ? 'red' : 'rgba(153, 102, 255, 1)'
                ),
                pointRadius: {{ fecha_values|safe }}.map((v, i) =>
                    i === {{ max_fecha_index }} ? 6 : 3
                )
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    ticks: {
                        autoSkip: true,
                        maxRotation: 45,
                        minRotation: 0
                    }
                },
                y: {
                    beginAtZero: true
                }
            }
        }
    });

</script>
{% endblock %}
